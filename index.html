<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google</title>
    <link href="//www.gstatic.com/images/branding/searchlogo/ico/favicon.ico" rel="icon">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/fill/style.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="topleft">

        <ul>
            <li><a href="https://mail.google.com/mail/u/0/&ogbl">Gmail</a></li>
            <li><a href="https://www.google.com/imghp?hl=en&ogbl">Images</a></li>
        </ul>

        <div class="icon">
            <i class="ph-bold ph-dots-nine"></i>
        </div>

        <div class="profile-pic">
            <img src="profile.png" alt="profile-pic">
        </div>

    </div>




    <main>

        <div class="heading">
            <h1>Google</h1>
        </div>

        <div class="searchbar">
            <span class="plusicon">
                <i class="ph-bold ph-plus"></i>
            </span>



            <textarea></textarea>



            <span class="mic-icon">
                <i class="ph-fill ph-microphone"></i>
            </span>



            <span class="lens-icon">
                <i class="ph-bold ph-camera"></i>
            </span>



            <button class="ai-mode">
                <i class="ph-bold ph-magnifying-glass"></i>
                AI Mode
            </button>


            
        </div>

        <div class="buttons">
            <button>Google Search</button>
            <button><a href="https://doodles.google/">I'm Feeling Lucky</a></button>
        </div>

        <div class="language">
            Google offered in: <a href="https://www.google.com/setprefs?sig=0_ilM1BgcCLrZ-CPbrnn2zr5i8b68%3D&hl=ne&source=homepage&sa=X&ved=0ahUKEwiqnY-FtpiXAxW0ZSoJHV9iMPAQ2ZgBCDY">नेपाली</a>
        </div>


    </main>


    <div class="location">
        Nepal
    </div>



    <footer>

        <div class="bottomleft">
            
            <ul>
                <li><a href="https://about.google/?utm_source=google-NP&utm_medium=referral&utm_campaign=hp-footer&fg=1">About</a></li>
                <li><a href="https://www.google.com/intl/en_np/ads/?subid=ww-ww-et-g-awa-a-g_hpafoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpafooter&fg=1">Advertising</a></li>
                <li><a href="https://www.google.com/services/?subid=ww-ww-et-g-awa-a-g_hpbfoot1_1!o2&utm_source=google.com&utm_medium=referral&utm_campaign=google_hpbfooter&fg=1">Business</a></li>
                <li><a href="https://google.com/search/howsearchworks/?fg=1">How Search works</a></li>
            </ul>

        </div>

        <div class="bottomright">

            <ul>
                <li><a href="https://policies.google.com/privacy?hl=en-NP&fg=1">Privacy</a></li>
                <li><a href="https://policies.google.com/terms?hl=en-NP&fg=1">Terms</a></li>
                <li><a href="">Settings</a></li>
            </ul>

        </div>

    </footer>





</body>
</html>
